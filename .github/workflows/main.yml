name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 生成 .env 文件（如不使用 Gemini API 可留空）
        run: |
          echo "# GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: 生成 Gradle Wrapper（项目本身未包含 gradlew）
        uses: gradle/actions/wrapper-validation@v4
        continue-on-error: true

      - name: 安装 Gradle 并生成 wrapper
        run: |
          # 如果仓库里没有 gradlew，用系统安装的 gradle 生成一份
          if [ ! -f "./gradlew" ]; then
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper --gradle-version 8.13
          fi
          chmod +x ./gradlew

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 如果需要签名的 Release APK，取消下面注释，并在仓库 Secrets 中配置
      # KEYSTORE_BASE64 / STORE_PASSWORD / KEY_PASSWORD
      # - name: 还原签名 keystore
      #   run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
      # - name: 构建 Release APK
      #   env:
      #     KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
      #     STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      #     KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      #   run: ./gradlew assembleRelease --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: netshield-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
