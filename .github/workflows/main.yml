name: Build Nested Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出源码
      uses: actions/checkout@v4

    - name: 配置 JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17' # 大多数现代 Kotlin 项目使用 JDK 17

    - name: 配置 Gradle 环境
      uses: gradle/actions/setup-gradle@v3

    - name: 赋予 Gradle 执行权限并编译
      # 这里的 working-directory 是核心关键，指引系统进入子文件夹寻找打包配置
      working-directory: ./noti-build-mps
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug --stacktrace

    - name: 上传 APK 供下载
      uses: actions/upload-artifact@v4
      with:
        name: android-app-apk
        # 同样更新提取产物的路径，加上子文件夹前缀
        path: "noti-build-mps/app/build/outputs/apk/debug/*.apk"
