name: Build Smart Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出源码
      uses: actions/checkout@v4

    - name: 配置 JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 配置 Gradle 环境
      uses: gradle/actions/setup-gradle@v3

    - name: 智能定位项目并编译
      run: |
        # 全局搜索寻找安卓项目的核心文件
        ROOT_FILE=$(find . -name "gradlew" -o -name "build.gradle.kts" -o -name "build.gradle" | head -n 1)
        
        if [ -z "$ROOT_FILE" ]; then
          echo "致命错误: 找不到任何 Android 配置文件！"
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$ROOT_FILE")
        echo "✅ 成功找到 Android 项目根目录: $PROJECT_DIR"
        
        # 自动进入该目录
        cd "$PROJECT_DIR"
        
        # 赋予权限并执行编译
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi

    - name: 智能提取 APK 产物
      uses: actions/upload-artifact@v4
      with:
        name: android-app-apk
        # 使用通配符，无论 APK 生成在哪个深度的子文件夹里都能自动抓取出来
        path: "**/*.apk"
