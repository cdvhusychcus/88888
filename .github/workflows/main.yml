name: Build Web App to APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出源码
      uses: actions/checkout@v4

    - name: 配置 Node.js 环境
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: 配置 JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 安装项目依赖并构建前端网页
      run: |
        npm install
        npm run build --if-present

    - name: 初始化并注入 Capacitor 安卓环境
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        # 寻找构建产物目录（dist 或 build，没有则用当前目录）
        BUILD_DIR="."
        if [ -d "dist" ]; then BUILD_DIR="dist"; fi
        if [ -d "build" ]; then BUILD_DIR="build"; fi
        
        npx cap init "MyApp" "com.example.myapp" --web-dir $BUILD_DIR
        npx cap add android
        npx cap sync android

    - name: 编译 生成 Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: 上传 APK 供下载
      uses: actions/upload-artifact@v4
      with:
        name: web-app-debug-apk
        path: "android/app/build/outputs/apk/debug/*.apk"
