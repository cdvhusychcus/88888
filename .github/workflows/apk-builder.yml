name: Android APK Builder Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许在 GitHub Actions 页面手动触发

jobs:
  build:
    name: Build and Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Initialize Environment Variables
        run: |
          # NetShield VPN 使用了 secrets-gradle-plugin，这里复制 example 文件以满足编译依赖
          cp .env.example .env

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netshield-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      # 提示：如果需要打包 Release 版本，需要配置签名密钥
